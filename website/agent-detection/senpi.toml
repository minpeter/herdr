id = "senpi"
version = "2026.08.08.1"
min_engine_version = 1
updated_at = "2026-08-08T00:00:00Z"
aliases = ["omo-senpi", "omo-native"]

# Senpi (npm @code-yeongyu/senpi) is the OmO Native coding-agent CLI —
# oh-my-openagent's native harness. process.title / comm is "senpi".
#
# Working chrome (live herdr detection buffer, senpi 2026.8.7):
#   "• Working (4m 27s • esc to interrupt)"
# Default message is "Working"; tool runs replace the label but keep the
# "(elapsed • <key> to interrupt)" suffix. Permission prompts show
# "Allow once" / "Allow always" / "Deny". Idle shows a bordered prompt
# with "❯" and no interrupt suffix.

[[rules]]
id = "permission_prompt_blocked"
state = "blocked"
priority = 980
region = "whole_recent"
visible_blocker = true
contains = ["Allow once", "Allow always", "Deny"]

[[rules]]
id = "interrupt_suffix_working"
state = "working"
priority = 900
region = "whole_recent"
visible_working = true
regex = ['to interrupt\)']

[[rules]]
id = "working_literal"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
any = [
  { contains = ["Working ("] },
  { contains = ["Working…"] },
  { contains = ["Working..."] },
]
